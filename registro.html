<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <div class="overlay"></div>
        <div class="login-form">
            <div class="form-image">
                <img src="/images/Oxxo_Logo.png" alt="Logo"> <!-- Imagen en el formulario -->
            </div>
            <h1 class="text_titulo">Registrarse</h1>
            <br>
            <form>
                <div class="row mb-3">
                    <div class='col-sm-6'>
                        <div class="form-group">
                            <label class="label_text" for="nombre">Nombre(s)</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre(s)" required>
                        </div>
                    </div>
                    <div class='col-sm-6'>
                        <div class="form-group">
                            <label class="label_text" for="apellido">Apellidos(s)</label>
                            <input type="text" class="form-control" id="apellido" placeholder="Ingresa tu apellido(s)" required>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class='col-sm-6'>
                        <div class="form-group">
                            <label class="label_text" for="email">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required>
                        </div>
                    </div>
                    <div class='col-sm-6'>
                        <div class="form-group">
                            <label class="label_text" for="genero">Genero</label>
                            <select id="genero" class="form-control form-select" required>
                                <option value="Hombre">Masculino</option>
                                <option value="Mujer">Femenino</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class='col-sm-6'>
                        <div class="form-group">
                            <label class="label_text" for="fecha_ingreso">Fecha de ingreso (Empresa)</label>
                            <input id="fecha_ingreso" class="form-control" type="date" required/>
                        </div>
                    </div>
                    <div class='col-sm-6'>
                        <div class="form-group">
                            <label class="label_text" for="fecha_nacimiento">Fecha Nacimiento</label>
                            <input id="fecha_nacimiento" class="form-control" type="date" required/>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="label_text" for="password">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                        <div class="input-group-append" onclick="togglePasswordVisibility()">
                            <span class="input-group-text"><i id="eye-icon" class="fas fa-eye"></i></span>
                        </div>
                    </div>
                </div> 
                <button type="button" class="btn btn-primary btn-block" onclick="registrarse();">Registrarme</button>
                <div class="text-center mt-3">
                    <a href="login.html">Iniciar Sesión</a>
                    <!-- <a href="login.html">Iniciar Sesión</a> | <a href="recuperar.html">Recuperar Contraseña</a> -->
                </div>
            </form>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Alerta de registro</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div id="mensaje_modal" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AJAX-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-2.0.3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    <!-- Hash -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sjcl/1.0.8/sjcl.min.js"></script>
    <!-- API backend -->
    <script src="js/config.js"></script>
    <script src="js/apiClient.js"></script>
    <script src="js/registro.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>

</body>
</html>

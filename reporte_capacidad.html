        <div class="container my-5">
            <h1 class="titulo">Reporte de Capacidad TI</h1>
            <br>
            <div class="row g-3 align-items-center">
                <div class="col-auto">
                    <img type="button" class="icono-filtro" src="images/filtrar.png"/>
                </div>
                <div class="col-auto">
                    <label class="col-form-label palabras-filtro">Filtros</label>
                </div>
                <hr class="col line-filtro"/>
            </div>
            <br>
            <!-- ======= FILTROS ======= -->
            <div class="row g-3 align-items-center">
                <div class="form-group col-md-3">
                    <label class="palabras-body" for="recurso">Recurso</label>
                    <select id="recurso" class="form-select">
                        <option value="Todos" selected>Todos</option>
                    </select>
                </div>
                <div class="form-group col-md-2">
                    <label class="palabras-body" for="year">Año</label>
                    <select id="year" class="form-select">
                        <option value="2024">2024</option>
                        <option value="2025" selected>2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
            </div>
            <br>
            <button id="boton_filtrar" class="btn btn-primary" type="button" onclick="buscar_reporte();">Buscar</button>
            <button id="boton_excel" class="btn btn-success boton-descargar" type="button" onclick="descargar_reporte();">Descargar Reporte</button>
            <!-- ======= TABLA ======= -->
            <br>
            <br>
            <div id="table-reporte" class="tabulator"></div>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="modal_perfil" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="staticBackdropLabel">Cerrar Sesión</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        ¿Está seguro que desea cerrar sesión?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" onclick="cerrar_sesion()">Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AJAX-->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-2.0.3.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
        <!-- Bootstrap JavaScript-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script type="text/javascript" src="https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>
        <!-- JS de Select2 -->
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <!-- GRAFICAS JavaScript-->
        <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js@latest/dist/Chart.min.js"></script> -->
        <!-- XLSX -->
        <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
        <!-- API backend -->
        <script src="js/config.js"></script>
        <script src="js/apiClient.js"></script>   
        <script src="js/permisos.js"></script>
        <script src="js/reporte_capacidad.js"></script>
        <script src="js/sesion.js"></script>

        <script>
            window.onload = async function() {
                if (!localStorage.getItem('correo') || !localStorage.getItem('nombre') || !localStorage.getItem('permisos')){
                    return window.location.href = "login.html";
                }

                await obtener_permisos();
                document.getElementById("nombre_perfil").innerHTML = localStorage.getItem('nombre') + " " + localStorage.getItem('apellido');;

                await obtener_reporte();
                return;
            };
            $(document).ready(function() {
                $('#recurso').select2({
                    placeholder: 'Busca un recurso...',
                    allowClear: true
                });
            });
        </script>
    </body>

    <!-- Modal Recurso -->
    <div class="modal fade " id="info_recurso" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Información del recurso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="form-group col-md-6">
                            <label for="nombre_recurso" style="font-weight: bold;">Nombre</label>
                            <input id="nombre_recurso" class="form-control" type="text" disabled/>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="rol_recurso" style="font-weight: bold;">Rol</label>
                            <input id="rol_recurso" class="form-control" type="text" disabled/>
                        </div>
                    </div>
                    <br>
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Gerencia</th>
                                <th scope="col">Jefe Directo</th>
                                <th scope="col">Bus</th>
                                <th scope="col">Programa</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <tr>
                                <td id="gerencia_recurso"></td>
                                <td id="jefe_directo_recurso"></td>
                                <td id="bus_recurso"></td>
                                <td id="programa_recurso"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Capacidad -->
    <div class="modal fade " id="desgloce_capacidad" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Desgloce de Capacidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="form-group col-md-6">
                            <label for="nombre_capacidad" style="font-weight: bold;">Nombre</label>
                            <input id="nombre_capacidad" class="form-control" type="text" disabled/>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="proyecto_area_capacidad" style="font-weight: bold;">Proyecto (Área)</label>
                            <input id="proyecto_area_capacidad" class="form-control" type="text" disabled/>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <div class="form-group col-md-4">
                            <label for="folio_capacidad" style="font-weight: bold;">Folio</label>
                            <input id="folio_capacidad" class="form-control" type="text" disabled/>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="prom_capacidad" style="font-weight: bold;">Promedio Capacidad</label>
                            <input id="prom_capacidad" class="form-control" type="text" disabled/>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="fecha_fin_capacidad" style="font-weight: bold;">Fecha Fin</label>
                            <input id="fecha_fin_capacidad" class="form-control" type="text" disabled/>
                        </div>
                    </div>
                    <br>
                    <div id="table-capacidad" class="tabulator"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

</html>
